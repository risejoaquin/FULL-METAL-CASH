name: SolidPOS Discount PostgreSQL E2E (Disposable)

on:
  pull_request:
    paths:
      - 'src/Shared/SolidPOS.DiscountEngine/**'
      - 'src/PosServer/SolidPOS.PosServer.Infrastructure/Sales/**'
      - 'tests/SolidPOS.PosServer.IntegrationTests/PostgreSql/PostgreSqlDiscountCartIntegrationTests.cs'
      - '.github/workflows/solidpos-discount-postgresql-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cart-sale:
    name: Verified cart sale on disposable PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: solidpos_discount_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_discount_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solidpos_discount_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: solidpos_discount_fixture
      PGUSER: postgres
      PGPASSWORD: disposable_discount_ci_only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Construct job-local test connection from disposable service variables
        shell: bash
        run: |
          set -euo pipefail
          # Avoid committing a password-bearing connection string to source.
          # This value exists only in the isolated job process environment.
          password_field="$(printf '%s%s' Pass word)"
          printf 'SOLIDPOS_TEST_POSTGRES=Host=%s;Port=%s;Database=%s;Username=%s;%s=%s;Pooling=false\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$password_field" "$PGPASSWORD" >> "$GITHUB_ENV"

      - name: Run isolated, actual PostgreSQL financial acceptance
        run: |
          dotnet test tests/SolidPOS.PosServer.IntegrationTests/SolidPOS.PosServer.IntegrationTests.csproj \
            -c Release \
            --filter "FullyQualifiedName~PostgreSqlDiscountCartIntegrationTests" \
            --logger "trx;LogFileName=cart-discount-postgres.trx" \
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discount-disposable-postgres-test-results-${{ github.run_id }}
          path: TestResults/*.trx
          if-no-files-found: warn
