        isStockTracked:
          type: boolean
        allowNegativeStock:
          type: boolean
        taxMode:
          type: string
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    CatalogVariant:
