openapi: 3.1.0
info:
  title: SolidPOS PosServer API
  version: 1.0.0
  description: 'Runtime contract for SolidPOS PosServer. Macro Phase 30 hardens parity between OpenAPI, implemented Minimal
    API endpoints, request/response contracts and RFC 7807 ProblemDetails errors. Roadmap-only endpoints must not be documented
    here.

    '
servers:
- url: http://localhost:5000/api/v1
  description: Local development
- url: https://api.example.com/api/v1
  description: Production
security:
- bearerAuth: []
tags:
- name: Auth
- name: Production Provisioning
- name: Terminals
- name: Terminal
- name: Tenant
- name: Customers
- name: Discounts
- name: Cash Drawers
- name: Inventory
- name: Sales
- name: Receipts
- name: Returns
- name: Sync
- name: Admin
- name: Audit
- name: Reports
- name: Builder
- name: Updates
- name: Observability
- name: System
- name: Health
paths:
  /provisioning/status:
    get:
      tags:
      - Production Provisioning
      summary: Returns production provisioning bootstrap status.
      operationId: get_provisioning_status
      security: []
      responses:
        '200':
          description: Provisioning status.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /provisioning/tenants/bootstrap:
    post:
      tags:
      - Production Provisioning
      summary: Bootstraps a production tenant with admin user and initial store.
      operationId: post_provisioning_tenants_bootstrap
      security: []
      parameters:
      - name: X-SolidPOS-Provision-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Production tenant created.
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Idempotent bootstrap already completed.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
