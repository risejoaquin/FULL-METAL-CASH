            $ref: '#/components/schemas/CatalogUnit'
        products:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CatalogVariant'
        barcodes:
