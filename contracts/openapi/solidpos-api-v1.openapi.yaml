components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    DateFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    DateTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Credenciales invalidas o token invalido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: No autorizado por RBAC/policy/tenant context.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Error de validacion.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflicto por version, idempotencia, estado o regla de negocio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnexpectedError:
      description: Error inesperado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    CreateReturnRequest:
      type: object
      required:
      - saleId
      - reason
      - lines
      properties:
        saleId:
          type: string
          format: uuid
        reason:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLine'
    ReturnListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        saleId:
          type: string
          format: uuid
        status:
          type: string
        totalCents:
          type: integer
          format: int64
        refundCents:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
    Return:
      type: object
      required:
      - id
      - saleId
      - totals
      - lines
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        saleId:
          type: string
          format: uuid
        totals:
          $ref: '#/components/schemas/SaleTotals'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLine'
        createdAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - traceId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    EntityStatus:
      type: string
      enum:
      - active
      - inactive
      - archived
    TenantStatus:
      type: string
      enum:
      - active
      - suspended
      - closed
    Money:
      type: object
      required:
      - amountCents
      - currency
      properties:
        amountCents:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: MXN
    Quantity:
      type: string
      pattern: ^-?\d{1,10}(\.\d{1,4})?$
      description: Decimal como string para conservar precision.
    PageMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        tenantId:
          type: string
          format: uuid
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
    AuthSession:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresAt
      - user
      - tenant
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
        tenant:
          $ref: '#/components/schemas/AuthTenant'
    AuthUser:
      type: object
      required:
      - id
      - email
      - name
      - roles
      - permissions
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    AuthTenant:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
    Tenant:
      type: object
      required:
      - id
      - name
      - status
      - settings
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        legalName:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        settings:
          $ref: '#/components/schemas/TenantSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenantSettings:
      type: object
      required:
      - timezone
      - currency
      - receipt
      - ui
      properties:
        timezone:
          type: string
          example: America/Hermosillo
        currency:
          type: string
          example: MXN
        receipt:
          $ref: '#/components/schemas/ReceiptSettings'
        ui:
          $ref: '#/components/schemas/UiSettings'
    TenantConfig:
      type: object
      required:
      - tenantId
      - businessVertical
      - uiLayout
      - modulesEnabled
      - branding
      - receiptSettings
      - hardwareProfile
      - featureFlags
      - version
      - updatedAt
      properties:
        tenantId:
          type: string
          format: uuid
        businessVertical:
          type: string
          example: qsr_cafe
        uiLayout:
          type: string
          example: touch_grid
        modulesEnabled:
          type: object
          additionalProperties: true
          example:
            modifiers: true
            recipes_bom: true
            barcode: true
            cash: true
            sync: true
        branding:
          type: object
          additionalProperties: true
        receiptSettings:
          type: object
          additionalProperties: true
        hardwareProfile:
          type: object
          additionalProperties: true
        featureFlags:
          type: object
          additionalProperties: true
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    UpdateTenantConfigRequest:
      type: object
      required:
      - businessVertical
      - uiLayout
      - modulesEnabled
      - branding
      - receiptSettings
      - hardwareProfile
      - featureFlags
      properties:
        businessVertical:
          type: string
        uiLayout:
          type: string
        modulesEnabled:
          type: object
          additionalProperties: true
        branding:
          type: object
          additionalProperties: true
        receiptSettings:
          type: object
          additionalProperties: true
        hardwareProfile:
          type: object
          additionalProperties: true
        featureFlags:
          type: object
          additionalProperties: true
        expectedVersion:
          type: integer
          format: int64
    CatalogSnapshot:
      type: object
      required:
      - tenantId
      - generatedAt
      - categories
      - units
      - products
      - variants
      - barcodes
      - priceLists
      - prices
      - modifierGroups
      - modifiers
      - productModifierGroups
      - recipes
      - recipeItems
      properties:
        tenantId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        categories:
