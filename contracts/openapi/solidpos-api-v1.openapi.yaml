        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
        status:
          type: string
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    CatalogUnit:
      type: object
      required:
      - id
      - code
      - name
      - symbol
      - factorToBase
      - isBase
