          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
        status:
          $ref: '#/components/schemas/EntityStatus'
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    UpdateAdminProductRequest:
      type: object
      required:
