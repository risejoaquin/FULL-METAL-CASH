            $ref: '#/components/schemas/CatalogPriceList'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPrice'
        modifierGroups:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModifierGroup'
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModifier'
        productModifierGroups:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProductModifierGroup'
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRecipe'
        recipeItems:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRecipeItem'
    CatalogCategory:
      type: object
      required:
      - id
      - name
      - sortOrder
      - status
      - version
      - updatedAt
