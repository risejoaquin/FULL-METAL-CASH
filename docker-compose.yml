services:
  postgres:
    image: postgres:16-alpine
    container_name: solidpos-postgres
    environment:
      POSTGRES_DB: solidpos
      POSTGRES_USER: solidpos
      POSTGRES_PASSWORD: solidpos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - solidpos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidpos -d solidpos"]
      interval: 5s
      timeout: 5s
      retries: 20

  posserver:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: solidpos-posserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=solidpos;Username=solidpos;Password=solidpos_dev_password
      Jwt__SigningKey: dev-only-solidpos-signing-key-change-before-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  solidpos_postgres_data:
